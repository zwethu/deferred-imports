[project]
name = "deferred-imports"
version = "0.1.0"
description = "Hidden module dependencies in Python deferred imports: mining and analysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "lifelines",
    "matplotlib>=3.11.2",
    "numpy",
    "pandas",
    "scipy",
    "tree-sitter",
    "tree-sitter-python",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deferred_imports"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
